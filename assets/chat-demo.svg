.u1{animation:u1 17s infinite;opacity:0}.d1{animation:d1 17s infinite;opacity:0}.a1{animation:a1 17s infinite;opacity:0}.u2{animation:u2 17s infinite;opacity:0}.d2{animation:d2 17s infinite;opacity:0}.a2{animation:a2 17s infinite;opacity:0}.w0{animation:w0 17s infinite;fill-opacity:0}.w1{animation:w1 17s infinite;fill-opacity:0}.w2{animation:w2 17s infinite;fill-opacity:0}.w3{animation:w3 17s infinite;fill-opacity:0}.w4{animation:w4 17s infinite;fill-opacity:0}.w5{animation:w5 17s infinite;fill-opacity:0}.x0{animation:x0 17s infinite;fill-opacity:0}.x1{animation:x1 17s infinite;fill-opacity:0}.x2{animation:x2 17s infinite;fill-opacity:0}.x3{animation:x3 17s infinite;fill-opacity:0}.x4{animation:x4 17s infinite;fill-opacity:0}
