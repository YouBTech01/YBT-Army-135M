<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="How YBT Army answers a question">
<title>How YBT Army answers a question</title>
<style>
text{font-family:'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif}
@keyframes h0{0%,3.649%{opacity:0}9.649%{opacity:.28}16.649%,100%{opacity:0}}@keyframes h1{0%,23.649%{opacity:0}29.649%{opacity:.28}36.649%,100%{opacity:0}}@keyframes h2{0%,43.649%{opacity:0}49.649%{opacity:.28}56.649%,100%{opacity:0}}@keyframes h3{0%,63.649%{opacity:0}69.649%{opacity:.28}76.649%,100%{opacity:0}}@keyframes h4{0%,83.649%{opacity:0}89.649%{opacity:.28}96.649%,100%{opacity:0}}
.h0{animation:h0 7s linear infinite;opacity:0}.h1{animation:h1 7s linear infinite;opacity:0}.h2{animation:h2 7s linear infinite;opacity:0}.h3{animation:h3 7s linear infinite;opacity:0}.h4{animation:h4 7s linear infinite;opacity:0}
.pk{animation:pk 7s linear infinite}
@keyframes pk{from{transform:translateX(0)}to{transform:translateX(1140px)}}
.trail{animation:pk 7s linear infinite;animation-delay:.12s;opacity:.35}
.chip{animation:fade .8s both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="340" rx="28" fill="#0D0D0D"/>
<text x="40" y="64" font-size="28" font-weight="800" fill="#fff">How YBT Army answers</text>
<text x="40" y="90" font-size="15" fill="#A1A1AA">One question travels through the model, one token at a time</text>
<rect x="40" y="110" width="180" height="96" rx="18" fill="#161616" stroke="#2A2A2A" stroke-width="1.5"/><rect class="h0" x="40" y="110" width="180" height="96" rx="18" fill="#2563EB"/><rect x="62" y="132" width="30" height="5" rx="2.5" fill="#2563EB"/><text x="62" y="166" font-size="21" font-weight="700" fill="#fff">Your message</text><text x="62" y="190" font-size="14" fill="#A1A1AA">text in</text><line x1="226" y1="158.0" x2="262" y2="158.0" stroke="#3A3A3A" stroke-width="2" stroke-dasharray="4 5"/><rect x="268" y="110" width="180" height="96" rx="18" fill="#161616" stroke="#2A2A2A" stroke-width="1.5"/><rect class="h1" x="268" y="110" width="180" height="96" rx="18" fill="#F59E0B"/><rect x="290" y="132" width="30" height="5" rx="2.5" fill="#F59E0B"/><text x="290" y="166" font-size="21" font-weight="700" fill="#fff">Tokenizer</text><text x="290" y="190" font-size="14" fill="#A1A1AA">49,152 tokens</text><line x1="454" y1="158.0" x2="490" y2="158.0" stroke="#3A3A3A" stroke-width="2" stroke-dasharray="4 5"/><rect x="496" y="110" width="180" height="96" rx="18" fill="#161616" stroke="#2A2A2A" stroke-width="1.5"/><rect class="h2" x="496" y="110" width="180" height="96" rx="18" fill="#7C3AED"/><rect x="518" y="132" width="30" height="5" rx="2.5" fill="#7C3AED"/><text x="518" y="166" font-size="21" font-weight="700" fill="#fff">30 blocks</text><text x="518" y="190" font-size="14" fill="#A1A1AA">attention + MLP</text><line x1="682" y1="158.0" x2="718" y2="158.0" stroke="#3A3A3A" stroke-width="2" stroke-dasharray="4 5"/><rect x="724" y="110" width="180" height="96" rx="18" fill="#161616" stroke="#2A2A2A" stroke-width="1.5"/><rect class="h3" x="724" y="110" width="180" height="96" rx="18" fill="#16A34A"/><rect x="746" y="132" width="30" height="5" rx="2.5" fill="#16A34A"/><text x="746" y="166" font-size="21" font-weight="700" fill="#fff">Output head</text><text x="746" y="190" font-size="14" fill="#A1A1AA">next-token odds</text><line x1="910" y1="158.0" x2="946" y2="158.0" stroke="#3A3A3A" stroke-width="2" stroke-dasharray="4 5"/><rect x="952" y="110" width="180" height="96" rx="18" fill="#161616" stroke="#2A2A2A" stroke-width="1.5"/><rect class="h4" x="952" y="110" width="180" height="96" rx="18" fill="#2563EB"/><rect x="974" y="132" width="30" height="5" rx="2.5" fill="#2563EB"/><text x="974" y="166" font-size="21" font-weight="700" fill="#fff">Reply</text><text x="974" y="190" font-size="14" fill="#A1A1AA">streamed to chat</text>
<line x1="20" y1="232" x2="1160" y2="232" stroke="#2A2A2A" stroke-width="2" stroke-dasharray="3 6"/>
<circle class="trail" cx="20" cy="232" r="16" fill="#fff"/>
<circle class="pk" cx="20" cy="232" r="8" fill="#fff"/>
<rect class="chip" x="40" y="270" width="262" height="44" rx="22" fill="none" stroke="#2A2A2A" stroke-width="1.5" style="animation-delay:0.4s"/><circle class="chip" cx="64" cy="292" r="5" fill="#2563EB" style="animation-delay:0.4s"/><text class="chip" x="82" y="298" font-size="16" fill="#E5E5E5" style="animation-delay:0.4s">134.5M parameters</text><rect class="chip" x="322" y="270" width="262" height="44" rx="22" fill="none" stroke="#2A2A2A" stroke-width="1.5" style="animation-delay:0.65s"/><circle class="chip" cx="346" cy="292" r="5" fill="#16A34A" style="animation-delay:0.65s"/><text class="chip" x="364" y="298" font-size="16" fill="#E5E5E5" style="animation-delay:0.65s">274 MB on disk</text><rect class="chip" x="604" y="270" width="262" height="44" rx="22" fill="none" stroke="#2A2A2A" stroke-width="1.5" style="animation-delay:0.9s"/><circle class="chip" cx="628" cy="292" r="5" fill="#7C3AED" style="animation-delay:0.9s"/><text class="chip" x="646" y="298" font-size="16" fill="#E5E5E5" style="animation-delay:0.9s">8,192 token context</text><rect class="chip" x="886" y="270" width="262" height="44" rx="22" fill="none" stroke="#2A2A2A" stroke-width="1.5" style="animation-delay:1.15s"/><circle class="chip" cx="910" cy="292" r="5" fill="#F59E0B" style="animation-delay:1.15s"/><text class="chip" x="928" y="298" font-size="16" fill="#E5E5E5" style="animation-delay:1.15s">~21 tokens / second</text>
</svg>
